version: "3.3"

services:
  ucar-next:
    container_name: ucar-next
    restart: always
    image: node:20.10.0
    ports:
      - "4000:3000"
    environment:
      - PORT=3000
    volumes:
      - ./:/usr/src/ucar-next
    working_dir: /usr/src/ucar-next

    networks:
      - client-network

    #For production build
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge
