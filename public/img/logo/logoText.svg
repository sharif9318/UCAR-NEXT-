<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E50914;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B20710;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glass" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0.95" />
    </radialGradient>
    
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background removed for transparency -->
  
  <!-- Realistic Sports Car Silhouette -->
  <g transform="translate(250, 45)" filter="url(#shadow)">
    <!-- Car base shadow -->
    <ellipse cx="0" cy="50" rx="85" ry="8" fill="#000000" opacity="0.3"/>
    
    <!-- Main body - sleek sports car profile -->
    <path d="M -75,35 L -70,28 L -65,25 L -50,20 L -35,18 L -25,15 L -10,12 L 10,10 L 30,10 L 50,12 L 65,15 L 75,20 L 80,25 L 82,30 L 82,40 L 78,45 L -75,45 Z" 
          fill="url(#carBody)" stroke="#5a0000" stroke-width="0.5"/>
    
    <!-- Hood line -->
    <path d="M 30,10 L 25,18 L 15,22" stroke="#5a0000" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- Roof/Cabin -->
    <path d="M -35,18 L -25,8 L -5,5 L 15,5 L 28,10" 
          fill="url(#carBody)" stroke="#5a0000" stroke-width="0.5"/>
    
    <!-- Windshield -->
    <path d="M -25,8 L -5,5 L -5,15 L -22,16 Z" fill="url(#glass)"/>
    
    <!-- Side window -->
    <path d="M -5,5 L 15,5 L 15,14 L -3,15 Z" fill="url(#glass)"/>
    
    <!-- Door line -->
    <line x1="-25" y1="18" x2="-25" y2="38" stroke="#5a0000" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="12" x2="5" y2="35" stroke="#5a0000" stroke-width="1" opacity="0.5"/>
    
    <!-- Highlight reflection on body -->
    <path d="M -60,22 Q 0,15 60,20" stroke="url(#highlight)" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M -50,27 Q 0,22 50,27" stroke="url(#highlight)" stroke-width="2" fill="none" opacity="0.4"/>
    
    <!-- Front wheel well -->
    <path d="M 55,35 Q 55,42 60,45 L 70,45 Q 75,42 75,35" fill="#0a0a0a"/>
    
    <!-- Rear wheel well -->
    <path d="M -50,35 Q -50,42 -45,45 L -35,45 Q -30,42 -30,35" fill="#0a0a0a"/>
    
    <!-- Front wheel -->
    <g transform="translate(65, 42)">
      <circle r="10" fill="url(#metallic)"/>
      <circle r="7" fill="#1a1a1a" stroke="#E50914" stroke-width="1"/>
      <circle r="3" fill="#2a2a2a"/>
      <!-- Spokes -->
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#E50914" stroke-width="0.5"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#E50914" stroke-width="0.5"/>
      <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#E50914" stroke-width="0.5"/>
      <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke="#E50914" stroke-width="0.5"/>
    </g>
    
    <!-- Rear wheel -->
    <g transform="translate(-40, 42)">
      <circle r="10" fill="url(#metallic)"/>
      <circle r="7" fill="#1a1a1a" stroke="#E50914" stroke-width="1"/>
      <circle r="3" fill="#2a2a2a"/>
      <!-- Spokes -->
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#E50914" stroke-width="0.5"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#E50914" stroke-width="0.5"/>
      <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#E50914" stroke-width="0.5"/>
      <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke="#E50914" stroke-width="0.5"/>
    </g>
    
    <!-- Headlight -->
    <ellipse cx="78" cy="28" rx="3" ry="4" fill="#FFE4B5" opacity="0.9"/>
    <ellipse cx="78" cy="28" rx="2" ry="3" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Tail light -->
    <ellipse cx="-72" cy="30" rx="2" ry="3" fill="#E50914" opacity="0.9"/>
    
    <!-- Spoiler detail -->
    <rect x="-78" y="27" width="8" height="2" fill="#8B0000" opacity="0.8"/>
    
    <!-- Front grille detail -->
    <line x1="75" y1="32" x2="80" y2="35" stroke="#3a0000" stroke-width="0.5"/>
    <line x1="75" y1="35" x2="80" y2="38" stroke="#3a0000" stroke-width="0.5"/>
  </g>
  
  <!-- UCAR Text -->
  <g filter="url(#shadow)">
    <text x="250" y="145" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" 
          fill="url(#redGradient)" text-anchor="middle" letter-spacing="3">
      UCAR
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="400" 
        fill="#E50914" text-anchor="middle" letter-spacing="5" opacity="0.9">
    PREMIUM USED CARS
  </text>
  
  <!-- Accent lines -->
  <line x1="130" y1="155" x2="160" y2="155" stroke="#E50914" stroke-width="2" opacity="0.6"/>
  <line x1="340" y1="155" x2="370" y2="155" stroke="#E50914" stroke-width="2" opacity="0.6"/>
</svg>